<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelena Skudra · English teacher</title>
<meta name="description" content="Online English lessons with Jelena Skudra for children, teens and adults, built around your interests.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23454192'/%3E%3Crect x='14' y='38' width='36' height='10' fill='%23E06C9F'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Caveat:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">

<header>
  <div class="wrap bar">
    <a class="logo" href="#top">Jelena Skudra<span>.</span></a>
    <nav class="links" aria-label="Main">
      <a href="#about" data-t="nav.about">About</a>
      <a href="#prices" class="price-nav" data-t="nav.prices">Prices</a>
      <a href="reviews.html" data-t="nav.reviews">Reviews</a>
      <a href="payment.html" data-t="nav.payment">Payment</a>
      <a href="#test" class="test-nav" data-t="test.nav">Free test</a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ru" data-lang="ru" aria-pressed="false">RU</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
    </div>
    <a class="btn btn-hl btn-sm book-link" href="#book" data-t="nav.book">Book a lesson</a>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap hero-grid">
      <div>
        <p class="eyebrow" data-t="hero.eyebrow"></p>
        <h1 data-t="hero.title" data-mark></h1>
        <p class="tagline" data-t="hero.tagline"></p>
        <p class="lead" data-t="hero.text"></p>
        <div class="cta">
          <a class="btn btn-hl book-link" href="#book" data-t="hero.bookButton"></a>
          <a class="btn btn-line" href="#lesson" data-t="hero.moreButton"></a>
        </div>
        <ul class="facts" id="facts"></ul>
      </div>
      <div class="art-box" aria-hidden="true">
        <svg class="art" viewBox="0 0 460 400" role="img">
          <ellipse class="shadow" cx="228" cy="362" rx="190" ry="16"/>
          <!-- bottom book -->
          <rect class="band" x="44" y="300" width="340" height="54" rx="5"/>
          <rect class="paper-edge" x="372" y="306" width="8" height="42" rx="2"/>
          <rect class="red" x="84" y="300" width="10" height="54"/>
          <rect class="red" x="100" y="300" width="4" height="54"/>
          <text class="spine-text" x="130" y="332">HISTORY OF ENGLISH</text>
          <!-- middle book -->
          <rect class="mid" x="74" y="254" width="292" height="46" rx="5"/>
          <rect class="paper-edge" x="355" y="260" width="7" height="34" rx="2"/>
          <text class="spine-text" x="104" y="282">STORIES · РАССКАЗЫ</text>
          <!-- top book -->
          <rect class="blue" x="58" y="214" width="316" height="40" rx="5"/>
          <rect class="paper-edge" x="364" y="220" width="7" height="28" rx="2"/>
          <text class="spine-text dark" x="92" y="239">GRAMMAR IN USE</text>
          <!-- open notebook -->
          <g transform="rotate(-5 230 150)">
            <rect class="shadow" x="92" y="104" width="284" height="116" rx="4"/>
            <rect class="page" x="84" y="94" width="142" height="116" rx="3"/>
            <rect class="page" x="226" y="94" width="142" height="116" rx="3"/>
            <line class="line" x1="94" y1="126" x2="218" y2="126"/><line class="line" x1="94" y1="148" x2="218" y2="148"/>
            <line class="line" x1="94" y1="170" x2="218" y2="170"/><line class="line" x1="94" y1="192" x2="218" y2="192"/>
            <line class="line" x1="234" y1="126" x2="360" y2="126"/><line class="line" x1="234" y1="148" x2="360" y2="148"/>
            <line class="line" x1="234" y1="170" x2="360" y2="170"/><line class="line" x1="234" y1="192" x2="360" y2="192"/>
            <line class="mline" x1="106" y1="98" x2="106" y2="206"/>
            <line class="mline" x1="248" y1="98" x2="248" y2="206"/>
            <text class="write" x="114" y="122" font-size="22">Hello!</text>
            <text class="write blue-ink" x="114" y="145" font-size="18">Привет!</text>
            <text class="write" x="114" y="167" font-size="17">Sveiki! Hola!</text>
            <text class="write blue-ink" x="256" y="122" font-size="18">I have been</text>
            <text class="write blue-ink" x="256" y="145" font-size="18">learning…</text>
            <text class="write" x="256" y="167" font-size="17">1066 → today</text>
            <path d="M256 176 q30 8 70 0" stroke="var(--margin)" stroke-width="2" fill="none"/>
          </g>
          <!-- pencil -->
          <g transform="rotate(-24 360 200)">
            <rect class="hl" x="300" y="192" width="120" height="14" rx="2"/>
            <rect class="ink" x="300" y="192" width="120" height="3" opacity=".15"/>
            <rect class="red" x="286" y="192" width="14" height="14" rx="3"/>
            <polygon points="420,192 440,199 420,206" fill="#E9CFA3"/>
            <polygon points="433,197 440,199 433,201" class="ink"/>
          </g>
          <!-- sticky note -->
          <g transform="rotate(6 90 70)">
            <rect class="hl" x="40" y="26" width="100" height="84" rx="3"/>
            <text class="note-text" x="56" y="62" font-size="24">A1 → C2</text>
            <text class="note-text" x="56" y="90" font-size="19">all ages!</text>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <section id="about">
    <div class="wrap about">
      <div>
        <h2 data-t="about.title"></h2>
        <span class="note" data-t="about.note"></span>
      </div>
      <div class="about-text" id="about-text"></div>
    </div>
  </section>

  <section id="offer" class="alt">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="offer.title"></h2></div>
      <div class="offer-grid" id="offer-list"></div>
    </div>
  </section>

  <section id="lesson">
    <div class="wrap lesson-grid">
      <div class="lesson-main">
        <h2 data-t="lesson.title"></h2>
        <div class="lesson-text" id="lesson-text"></div>
        <h3 data-t="lesson.flexTitle"></h3>
        <p class="muted-p" data-t="lesson.flex"></p>
      </div>
      <aside class="lesson-side">
        <div class="expect">
          <p class="eyebrow" data-t="lesson.expectTitle"></p>
          <ul id="expect-list"></ul>
        </div>
        <figure class="example">
          <p class="eyebrow" data-t="lesson.exampleLabel"></p>
          <blockquote data-t="lesson.example"></blockquote>
        </figure>
      </aside>
    </div>
  </section>

  <section id="prices" class="alt" hidden>
    <div class="wrap">
      <div class="sec-head"><h2 data-t="prices.title"></h2><p data-t="prices.text"></p></div>
      <div class="offers" id="price-list"></div>
    </div>
  </section>

  <section id="reviews">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="reviews.title"></h2></div>
      <div class="reviews" id="reviews-list" data-limit="featured"></div>
      <p class="more-link"><a href="reviews.html" data-t="reviewsPage.allLink"></a></p>
    </div>
  </section>

  <section id="start" class="alt">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="steps.title"></h2></div>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section id="levels">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="levels.title"></h2><p data-t="levels.text"></p></div>
      <div class="levels" id="levels-list"></div>
    </div>
  </section>

  <section id="test" class="alt">
    <div class="wrap test-grid">
      <div class="sec-head">
        <p class="eyebrow" data-t="test.eyebrow"></p>
        <h2 data-t="test.title"></h2>
        <p data-t="test.text"></p>
      </div>
      <div class="quiz" id="quiz" aria-live="polite"></div>
    </div>
  </section>

  <section id="languages">
    <div class="wrap duo">
      <div>
        <h2 data-t="languages.title"></h2>
        <p class="lang-text" data-t="languages.text"></p>
        <ul class="chips" id="chips"></ul>
      </div>
      <article class="card">
        <p class="eyebrow" data-t="word.label"></p>
        <p class="word" data-t="word.word"></p>
        <p class="origin" data-t="word.origin"></p>
        <p class="story" data-t="word.story"></p>
      </article>
    </div>
  </section>

  <section id="faq">
    <div class="wrap narrow">
      <div class="sec-head"><h2 data-t="faq.title"></h2></div>
      <div class="faq" id="faq-list"></div>
    </div>
  </section>

  <section id="book" class="band">
    <div class="wrap book-grid">
      <div>
        <div class="sec-head"><h2 data-t="book.title"></h2><p data-t="book.text"></p></div>
        <a class="btn btn-hl" id="calendar-btn" href="#book" target="_blank" rel="noopener" data-t="book.button"></a>
        <p class="soon" id="soon" data-t="book.soon" hidden></p>
      </div>
      <div id="contact-box">
        <h3 data-t="book.contactTitle"></h3>
        <ul class="contacts" id="contacts"></ul>
      </div>
    </div>
    <div class="wrap" id="embed-box" hidden>
      <iframe id="booking-frame" title="Booking calendar" loading="lazy"></iframe>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year">2026</span> Jelena Skudra</span>
    <span data-t="footer"></span>
  </div>
</footer>

<script src="content.js"></script>
<script src="site.js"></script>
</body>
</html>
