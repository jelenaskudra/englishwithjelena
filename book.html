<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelena Skudra · English teacher</title>
<meta name="description" content="Online English lessons with Jelena Skudra for children, teens and adults, built around your interests.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23454192'/%3E%3Crect x='14' y='38' width='36' height='10' fill='%23E06C9F'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Caveat:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="book">

<header>
  <div class="wrap bar">
    <a class="logo" href="index.html">Jelena Skudra<span>.</span></a>
    <nav class="links" aria-label="Main">
      <a href="about.html" data-t="nav.about">About</a>
      <a href="prices.html" class="price-nav" data-t="nav.prices">Prices</a>
      <a href="reviews.html" data-t="nav.reviews">Reviews</a>
      <a href="test.html" class="test-nav" data-t="nav.test">Free test</a>
      <a href="payment.html" data-t="nav.payment">Payment</a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ru" data-lang="ru" aria-pressed="false">RU</button>
      <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
    </div>
    <a class="btn btn-hl btn-sm" href="book.html" data-t="nav.book">Book a lesson</a>
  </div>
</header>

<main id="top">
  <section class="page-head">
    <div class="wrap">
      <h1 data-t="pages.book.title"></h1>
      <p class="lead" data-t="pages.book.lead"></p>
    </div>
  </section>

  <section id="book" class="band">
    <div class="wrap book-grid">
      <div>
        <div class="sec-head"><h2 data-t="book.title"></h2><p data-t="book.text"></p></div>
        <a class="btn btn-hl" id="calendar-btn" href="#book" target="_blank" rel="noopener" data-t="book.button"></a>
        <p class="soon" id="soon" data-t="book.soon" hidden></p>
      </div>
      <div id="contact-box">
        <h3 data-t="book.contactTitle"></h3>
        <ul class="contacts" id="contacts"></ul>
      </div>
    </div>
    <div class="wrap" id="embed-box" hidden>
      <iframe id="booking-frame" title="Booking calendar" loading="lazy"></iframe>
    </div>
  </section>

  <section id="start">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="steps.title"></h2></div>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year">2026</span> Jelena Skudra</span>
    <span data-t="footer"></span>
  </div>
</footer>

<script src="content.js"></script>
<script src="site.js"></script>
</body>
</html>
